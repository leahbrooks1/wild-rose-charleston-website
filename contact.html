<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Wild Rose Charleston.">
    <title>Contact | Wild Rose Charleston</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

<header>
    <div class="container">
        <h1>Wild Rose Charleston</h1>

        <nav aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="checkout.html">Book Appointment</a></li>
            </ul>
        </nav>
    </div>
</header>

<main>

    <section class="page-intro">
        <div class="container">
            <h2>Contact Us</h2>
            <p>
                Have a question about Wild Rose Charleston?
                Send us a message using the form below.
            </p>
        </div>
    </section>

    <section>
        <div class="container contact-section">

            <h2>Get in Touch</h2>

            <div id="formMessage" aria-live="polite"></div>

            <form id="contactForm" novalidate>

                <div>
                    <label for="fullName">Full Name</label>
                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                    >
                </div>

                <div>
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >
                </div>

                <div>
                    <label for="subject">Subject</label>
                    <input
                        type="text"
                        id="subject"
                        name="subject"
                    >
                </div>

                <div>
                    <label for="message">Message</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        required
                    ></textarea>
                </div>

                <button type="submit" class="button">
                    Send Message
                </button>

            </form>

        </div>
    </section>

</main>

<footer>
    <div class="container">
        <p>&copy; 2026 Wild Rose Charleston. All rights reserved.</p>
        <p>Website redesign project by Leah Brooks.</p>
    </div>
</footer>

</body>
</html>
